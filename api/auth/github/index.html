<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting to GitHub OAuth...</title>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #090a0f; color: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
  <div style="text-align: center; padding: 20px;">
    <div style="width: 48px; height: 48px; border: 3px solid #24292e; border-top-color: #ffffff; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px;"></div>
    <h2>Connecting to GitHub...</h2>
    <p style="color: #94a3b8; font-size: 0.9rem;">Redirecting to GitHub OAuth consent screen.</p>
  </div>
  <style>
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
  <script>
    const clientId = "Ov23liKzTySirwshmW8f";
    const redirectUri = window.location.origin + "/api/auth/callback/github";
    const authUrl = "https://github.com/login/oauth/authorize?" +
      "client_id=" + encodeURIComponent(clientId) +
      "&scope=read:user,user:email" +
      "&redirect_uri=" + encodeURIComponent(redirectUri);
    window.location.href = authUrl;
  </script>
</body>
</html>
