<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Authenticating with GitHub...</title>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #090a0f; color: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
  <div style="text-align: center; padding: 20px;">
    <div style="width: 48px; height: 48px; border: 3px solid #10b981; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px;"></div>
    <h2>Authenticating with GitHub...</h2>
    <p style="color: #94a3b8; font-size: 0.9rem;">Verifying GitHub credentials and unlocking developer dashboard...</p>
  </div>
  <style>
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code');

    const sessionUser = {
      id: 'gh_' + (code ? code.substring(0, 10) : Date.now()),
      name: 'GitHub Developer',
      handle: 'github_developer',
      email: 'developer@truecalci.com',
      avatar_url: 'https://avatars.githubusercontent.com/u/982734?v=4',
      provider: 'github',
      tier: 'Developer Starter',
      tierId: 'starter',
      quotaLimit: 2500
    };

    localStorage.setItem('tc_dev_user', JSON.stringify(sessionUser));
    localStorage.setItem('tc_dev_auth', 'true');
    window.location.href = '/#developer';
  </script>
</body>
</html>
