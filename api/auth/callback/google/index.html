<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TrueCalci Gateway</title>
  <meta name="description" content="TrueCalci Official Edge Developer Gateway">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #090a0f; color: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
  <div style="text-align: center; padding: 24px; max-width: 420px;">
    <div style="width: 44px; height: 44px; border: 3px solid #3b82f6; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px;"></div>
    <h2 style="margin: 0 0 8px; font-size: 1.25rem;">TrueCalci Developer Gateway</h2>
    <p style="color: #94a3b8; font-size: 0.88rem; margin: 0;">Verifying session credentials and provisioning compute workspace...</p>
  </div>
  <style>
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
  <script>
    const hash = window.location.hash.substring(1);
    const params = new URLSearchParams(hash || window.location.search);
    const idToken = params.get('id_token') || params.get('access_token');
    const existing = JSON.parse(localStorage.getItem('tc_dev_user') || '{}');
    const activeTier = localStorage.getItem('tc_active_tier') || existing.tierId || 'pro';
    
    let name = existing.name && existing.name !== 'Google Developer' ? existing.name : 'Developer';
    let email = existing.email || 'developer@truecalci.com';
    let picture = existing.avatar_url || 'https://lh3.googleusercontent.com/a/default-user';

    if (idToken && idToken.includes('.')) {
      try {
        const base64Url = idToken.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
          return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));
        const payload = JSON.parse(jsonPayload);
        if (payload.name) name = payload.name;
        if (payload.email) email = payload.email;
        if (payload.picture) picture = payload.picture;
      } catch (e) {
        console.warn("Could not decode JWT payload:", e);
      }
    }

    const sessionUser = {
      id: existing.id || ('goog_' + Date.now()),
      name: name,
      handle: email.split('@')[0],
      email: email,
      avatar_url: picture,
      provider: 'google',
      tier: activeTier === 'pro' ? 'Pro Agency & Scale (Monthly)' : 'Developer Starter',
      tierId: activeTier,
      quotaLimit: activeTier === 'pro' ? 15000 : 2500,
      apiKey: existing.apiKey || ('tc_live_' + activeTier + '_' + Math.random().toString(36).substring(2, 12))
    };

    localStorage.setItem('tc_dev_user', JSON.stringify(sessionUser));
    localStorage.setItem('tc_dev_auth', 'true');
    localStorage.setItem('tc_active_tier', activeTier);
    window.location.href = '/#subscriptions';
  </script>
</body>
</html>
