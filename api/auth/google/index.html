<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TrueCalci Secure Gateway</title>
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="googlebot" content="noindex,nofollow,noarchive">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #090a0f; color: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
  <div style="text-align: center; padding: 24px; max-width: 420px;">
    <div style="width: 44px; height: 44px; border: 3px solid #3b82f6; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px;"></div>
    <h2 style="margin: 0 0 8px; font-size: 1.25rem;">TrueCalci Developer Gateway</h2>
    <p style="color: #94a3b8; font-size: 0.88rem; margin: 0;">Connecting to OAuth 2.0 provider...</p>
  </div>
  <style>
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
  <script>
    const clientId = ["535557926744", "smkd0ehl4i67ontjgj9hv3egbqqtdb2v.apps.googleusercontent.com"].join("-");
    const redirectUri = window.location.origin + "/api/auth/callback/google";
    const authUrl = "https://accounts.google.com/o/oauth2/v2/auth?" +
      "client_id=" + encodeURIComponent(clientId) +
      "&response_type=token%20id_token" +
      "&scope=openid%20profile%20email" +
      "&nonce=" + Date.now() +
      "&redirect_uri=" + encodeURIComponent(redirectUri);
    window.location.href = authUrl;
  </script>
</body>
</html>
